<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <!-- Icon Mark: Leaf inside rounded square -->
  <rect x="8" y="8" width="74" height="74" rx="18" fill="#0F766E" />
  <path d="M 28 60 C 28 36, 43 25, 58 25 C 58 49, 43 60, 28 60 Z" fill="#FFFFFF" />
  <path d="M 28 60 Q 43 44, 58 25" stroke="#0F766E" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Wordmark Group (NutriDupe Original Typography & Tight Spacing) -->
  <g transform="translate(95, 58)" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="800" font-size="38" fill="#0F172A">
    <!-- Nutri -->
    <text x="0" y="0">Nutri</text>
    
    <!-- Leaf Accent precisely positioned over the 'i' in Nutri -->
    <path d="M 73 -30 C 73 -38, 80 -43, 88 -43 C 88 -35, 80 -30, 73 -30 Z" fill="#10B981" />
    
    <!-- Dupe (placed right next to Nutri) -->
    <text x="96" y="0" font-weight="800">Dupe</text>
  </g>

  <!-- Tagline: RESEARCH PLATFORM -->
  <text x="95" y="76" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="3.2" fill="#64748B">RESEARCH PLATFORM</text>
</svg>
